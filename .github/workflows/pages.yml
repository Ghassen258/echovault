name: Build and deploy browser game

on:
  push:
    branches: [main]
    paths:
      - 'src/game.*'
      - 'src/web_bridge.cpp'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.19
      - name: Compile native C++ logic to WebAssembly
        run: |
          mkdir -p dist
          em++ -std=c++17 -O2 -Isrc src/game.cpp src/web_bridge.cpp \
            --bind --no-entry -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT=web \
            -s FILESYSTEM=0 -s ALLOW_MEMORY_GROWTH=1 -s ASSERTIONS=0 \
            -o dist/echovault.mjs
          cp web/index.html web/styles.css web/game.js dist/
          touch dist/.nojekyll
          test -s dist/echovault.mjs
          test -s dist/echovault.wasm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
